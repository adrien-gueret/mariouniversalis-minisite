name: Build & Deploy
on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: "2 days"
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install & build
        run: |
          npm ci
          npm run build
      - name: Upload public dir
        uses: actions/upload-artifact@v4
        with:
          name: mini-site-build
          path: public
        env:
          CI: true
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download public dir
        uses: actions/download-artifact@v4
        with:
          name: mini-site-build
      - name: Upload to MU via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Sans "protocol", l'action utilise du FTP en clair : le mot de passe
          # et le contenu des fichiers transitent en clair sur Internet.
          # "strict" vérifie le certificat du serveur (Let's Encrypt valide
          # depuis le 01/08/2026) ; sans ça la connexion serait chiffrée mais
          # pas authentifiée.
          protocol: ftps
          security: strict
          server-dir: "httpdocs/minisite/"
